<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5d56">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Duka POS</title>
<style>
  :root{--g:#0f766e;--gd:#0b4f4a;--gl:#e6f4f1;--bg:#f2f5f4;--card:#fff;--tx:#0f1f1d;--mu:#667573;--line:#e3e9e7;--red:#b42318;--amb:#b45309;--amb-l:#fff4e0;--gold:#c58a00}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(env(safe-area-inset-bottom) + 90px)}
  header{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;padding:12px 14px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  header h1{font-size:18px;margin:0;line-height:1.2;font-weight:700}
  header small{display:block;font-size:12px;font-weight:400;opacity:.88;margin-top:2px}
  #st{font-size:12px;background:rgba(255,255,255,.2);padding:5px 10px;border-radius:99px;white-space:nowrap}
  nav{display:flex;background:#fff;position:sticky;top:0;z-index:4;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:1 0 auto;padding:12px 14px;border:0;background:none;font-size:14px;font-weight:600;color:var(--mu);border-bottom:3px solid transparent;white-space:nowrap}
  nav button.on{color:var(--g);border-color:var(--g)}
  .badge{display:inline-block;min-width:16px;padding:0 5px;margin-left:4px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;line-height:16px}
  main{padding:12px;max-width:720px;margin:0 auto}
  input,select{width:100%;padding:12px;font-size:16px;border:1px solid #cfd8d6;border-radius:12px;background:#fff;color:var(--tx)}
  input:focus,select:focus{outline:2px solid var(--g);border-color:var(--g)}
  input[type=checkbox]{width:auto}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{padding:8px 14px;border-radius:99px;border:1px solid #cfd8d6;background:#fff;font-size:14px;white-space:nowrap;color:var(--tx)}
  .chip.on{background:var(--g);color:#fff;border-color:var(--g)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;min-height:88px;color:var(--tx)}
  .item:active{transform:scale(.97);background:var(--gl)}
  .item b{display:block;font-size:15px;line-height:1.2}
  .item .p{color:var(--g);font-weight:800;margin-top:6px;display:block}
  .item .s{font-size:12px;color:var(--mu)}
  .item .s.low{color:var(--amb);font-weight:700}
  .item .s.out{color:var(--red);font-weight:700}

  #cart{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);box-shadow:0 -6px 18px rgba(0,0,0,.1);z-index:6;max-height:70vh;overflow:auto}
  .line{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:15px}
  .line span.n{flex:1}
  .q{width:36px;height:36px;border-radius:10px;border:1px solid #cfd8d6;background:#fff;font-size:20px;line-height:1;color:var(--tx)}
  .row{display:flex;gap:8px;align-items:center;margin-top:8px}
  .row>*{min-width:0}
  .pay{flex:1;padding:11px 0;border-radius:12px;border:2px solid #cfd8d6;background:#fff;font-weight:700;font-size:14px;color:var(--tx)}
  .pay.on{border-color:var(--g);background:var(--gl);color:var(--gd)}
  .go{flex:1.4;padding:14px;border:0;border-radius:12px;background:var(--g);color:#fff;font-size:16px;font-weight:700}
  .go:disabled{background:#9db0ad}
  .go.gold{background:var(--gold)}
  .ghost{padding:9px 13px;border-radius:12px;border:1px solid #cfd8d6;background:#fff;font-weight:600;font-size:14px;color:var(--tx)}
  .danger{color:var(--red);border-color:#f0c4c0}
  .total{font-size:21px;font-weight:800}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
  .card h3{margin:0 0 6px;font-size:16px}
  .hero{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-radius:18px;padding:16px;margin-bottom:10px}
  .hero .hi{font-size:14px;opacity:.9}
  .hero .amt{font-size:32px;font-weight:800;margin:4px 0}
  .hero .sub{font-size:13px;opacity:.9}
  .pts{background:linear-gradient(135deg,#fff7e0,#ffeab8);border:1px solid #f1d58a;color:#5a4200}
  .big{font-size:26px;font-weight:800;color:var(--g)}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #f0f4f3}
  .kv:last-child{border:0}
  label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
  label.chk{display:flex;gap:8px;align-items:center;color:var(--tx)}
  .mu{color:var(--mu);font-size:13px}
  .red{color:var(--red);font-weight:700}
  .amb{color:var(--amb);font-weight:700}
  .grn{color:var(--g);font-weight:700}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#eef2f1;color:var(--mu)}
  .pill.New{background:#e8f0ff;color:#1d4ed8}.pill.Confirmed{background:var(--amb-l);color:var(--amb)}.pill.Delivered{background:var(--gl);color:var(--gd)}.pill.Cancelled{background:#fde8e6;color:var(--red)}
  .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#0f1f1d;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:90vw;text-align:center}
  .setup{padding:24px;text-align:center}
  .warn{background:#fffbeb;border:1px solid #fcd34d;color:#92400e;border-radius:12px;padding:10px;font-size:13px;margin-bottom:10px}
  .ok{background:var(--gl);border:1px solid #9ad5cb;color:var(--gd);border-radius:12px;padding:12px;margin-bottom:10px}
  a{color:var(--g)}
  .linkbox{word-break:break-all;font-size:12px;background:#f2f5f4;border-radius:10px;padding:8px;margin:8px 0}
  .rl{border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px;background:#fcfdfd}
  .rl .t{display:flex;justify-content:space-between;gap:8px;font-weight:700}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .res{border:1px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden}
  .res button{display:flex;justify-content:space-between;width:100%;padding:11px 12px;border:0;border-bottom:1px solid var(--line);background:#fff;font-size:15px;text-align:left;color:var(--tx)}
  .res button:last-child{border:0}
  .invrow{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;color:var(--tx);font-size:15px}
  .pill.Paid{background:var(--gl);color:var(--gd)}.pill.Overdue{background:#fde8e6;color:var(--red)}.pill.Part{background:var(--amb-l);color:var(--amb)}.pill.Unpaid{background:#e8f0ff;color:#1d4ed8}
  .doc{color:#111;font-size:14px;line-height:1.35}
  .doc .dh{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:8px}
  .doc .dn{font-size:18px;font-weight:800}
  .doc .dt{font-size:16px;font-weight:800;letter-spacing:.06em;margin:6px 0}
  .doc table{width:100%;border-collapse:collapse;margin:6px 0}
  .doc th{font-size:12px;text-align:left;color:#555;border-bottom:1px solid #999;padding:5px 4px}
  .doc td{padding:5px 4px;border-bottom:1px solid #e5e5e5;vertical-align:top}
  .doc .r{text-align:right;white-space:nowrap}
  .doc table.meta td{border:0}
  .doc table.tot{width:100%}.doc table.tot tr.g td{font-weight:800;border-top:1px solid #111}
  .doc .note,.doc .terms{font-size:12px;color:#444}.doc .foot{text-align:center;color:#555;margin-top:14px}
  .doc.rcpt{max-width:300px;margin:0 auto}
  #printArea{display:none}
  @media print{
    body{background:#fff;padding:0}
    body>*:not(#printArea){display:none!important}
    #printArea{display:block!important;padding:12px}
  }
  nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 14px 7px;font-size:12px}
  nav button svg{display:block}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
  .kpi{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
  .kpi .l{font-size:12px;color:var(--mu)}.kpi .v{font-size:19px;font-weight:800;margin-top:2px;letter-spacing:-.01em}.kpi .d{font-size:12px;margin-top:3px}
  .kpi.pos .v{color:var(--g)}.kpi.neg .v{color:var(--red)}
  .up{color:#0f766e;font-weight:700}.down{color:var(--red);font-weight:700}
  .seg{display:flex;height:14px;border-radius:99px;overflow:hidden;background:#eef2f1;margin:8px 0 6px}.seg i{display:block;height:100%}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:#444;margin-bottom:6px}.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
  .hb{margin:8px 0}.hb .t{display:flex;justify-content:space-between;gap:8px;font-size:13px}.hb .b{height:8px;border-radius:99px;background:#eef2f1;margin-top:3px;overflow:hidden}.hb .b i{display:block;height:100%;background:var(--g);border-radius:99px}
  .cols{display:flex;align-items:flex-end;gap:6px;height:96px;margin:8px 0 6px}.cols>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
  .cols i{display:block;width:100%;background:linear-gradient(180deg,var(--g),var(--gd));border-radius:6px 6px 2px 2px;min-height:2px}.cols span{font-size:10px;color:var(--mu);margin-top:3px}
  .lock{text-align:center;padding:22px 14px}.lock .lk{font-size:30px}
  #banner:empty{display:none}.bn{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--amb-l);color:#7a3d00;border-bottom:1px solid #f1d58a;padding:8px 12px;font-size:13px}
  .plan.cur{border:2px solid var(--g)}.plan .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.plan ul{margin:6px 0 12px;padding-left:18px;font-size:14px;line-height:1.5}
  .card{box-shadow:0 1px 2px rgba(15,31,29,.04)}
  .repcard{padding:12px}
  .doc .band{background:var(--gd);color:#fff;border-radius:10px;padding:10px 12px;margin:6px 0 8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc .band .bt{font-size:16px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}.doc .band .bs{font-size:12px;opacity:.9;margin-top:2px}
  .doc .sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#555;margin:14px 0 4px}
  .doc .kpis{margin:8px 0}.doc .kpi{break-inside:avoid}
  .doc .seg i,.doc .hb .b i,.doc .legend b{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .scan{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}.scan video{flex:1;width:100%;object-fit:cover}.scanbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;background:#111;color:#fff}
  .tbls{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:520px){.tbls{grid-template-columns:repeat(3,1fr)}}
  .tbl{border:2px solid var(--line);border-radius:16px;padding:12px;text-align:left;background:#fff;min-height:92px;color:var(--tx);display:flex;flex-direction:column;gap:3px;font-size:15px}.tbl b{font-size:17px}
  .tbl.free{border-style:dashed;color:var(--mu)}.tbl.busy{border-color:#f1d58a;background:#fffaf0}.tbl.rdy{border-color:var(--g);background:var(--gl)}
  .pill.stsent{background:var(--amb-l);color:var(--amb)}.pill.stready{background:var(--gl);color:var(--gd)}.pill.stserved{background:#e8f0ff;color:#1d4ed8}.pill.stvoid{background:#fde8e6;color:var(--red)}
  .kcard{background:#fff;border:2px solid #f1d58a;border-radius:16px;padding:12px;margin-bottom:10px}.kcard.late{border-color:var(--red);background:#fff5f4}.kcard.done{border-color:var(--g);background:var(--gl)}
  .kh{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:14px;color:var(--mu)}.kh b{font-size:19px;color:var(--tx)}
  .kl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid #f0e6c8;font-size:18px}.kl.ready{color:var(--gd)}.knote{font-size:14px;color:var(--red);font-weight:700}
  .pill.clsStar{background:var(--gl);color:var(--gd)}.pill.clsPlowhorse{background:var(--amb-l);color:var(--amb)}.pill.clsPuzzle{background:#e8f0ff;color:#1d4ed8}.pill.clsDog{background:#fde8e6;color:var(--red)}
  .doc .pill{-webkit-print-color-adjust:exact;print-color-adjust:exact}
</style>

<body>
<header><h1 id="shop">Duka POS<small id="who"></small></h1><span id="st">…</span></header>
<nav id="nav"></nav>
<div id="banner"></div>
<main id="main"></main>
<div id="cart" style="display:none"></div>
<div id="printArea"></div>

<script>
/* ---------- shop link: index.html?api=...&k=... (remembered on this phone) ---------- */
var P = new URLSearchParams(location.search);
if (P.get('api')) {
  try { localStorage.setItem('api', P.get('api')); localStorage.setItem('k', P.get('k') || ''); } catch (e) {}
  history.replaceState({}, '', location.pathname);
}
var API = '', KEY = '';
try { API = localStorage.getItem('api') || ''; KEY = localStorage.getItem('k') || ''; } catch (e) {}

/* ---------- offline queue on this phone (one database per shop key) ---------- */
var STORES = ['sales', 'receipts', 'payments', 'adjustments', 'expenses'];
var dbp = new Promise(function (res, rej) {
  var r = indexedDB.open('duka2_' + (KEY || 'none'), 2);
  r.onupgradeneeded = function () {
    STORES.forEach(function (n) { if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n, { keyPath: 'id' }); });
  };
  r.onsuccess = function () { res(r.result); };
  r.onerror = function () { rej(r.error); };
});
function tx(store, mode, fn) {
  return dbp.then(function (d) {
    return new Promise(function (res, rej) {
      var t = d.transaction(store, mode), rq = fn(t.objectStore(store));
      t.oncomplete = function () { res(rq && rq.result); };
      t.onerror = function () { rej(t.error); };
    });
  });
}
var put = function (s, o) { return tx(s, 'readwrite', function (st) { return st.put(o); }); };
var all = function (s) { return tx(s, 'readonly', function (st) { return st.getAll(); }); };

/* ---------- state ---------- */
var S = null;   // last answer from the server for this shop
try { S = JSON.parse(localStorage.getItem('state_' + KEY) || 'null'); } catch (e) {}
var cart = {}, pay = 'Cash', cat = 'All', q = '', tab = 'sell', stockSub = 'receive', moreSub = 'expenses';
var cust = '', custPhone = '', payFor = null, payM = 'Cash', newLink = null, given = '';
var F = { recSupplier: '', recSupPhone: '', recQ: '', iq: '', cq: '', oq: '', ordNote: '', adjCode: '', adjQty: '', adjReason: 'Damaged',
          expAmount: '', expCat: 'Transport', expMethod: 'Cash', expNote: '', custName: '', custPhone: '',
          iName: '', iCat: '', iPrice: '', iCost: '', iOpen: '', iReorder: '' };
var recLines = [], recRef = '', counts = {}, editCode = null, newItemOpen = false;
var ordCart = {}, usePts = 0, orderDone = null, ordCat = 'All';
try { var dr = JSON.parse(localStorage.getItem('draft_' + KEY) || 'null'); if (dr) { recLines = dr.lines || []; F.recSupplier = dr.sup || ''; recRef = dr.ref || ''; } } catch (e) {}
var L = { sales: [], receipts: [], payments: [], adjustments: [], expenses: [] };
var syncing = false, lastSync = null, syncErr = false, errMsg = '';

var v2 = function () { return !!(S && S.v >= 2); };
var v3 = function () { return !!(S && S.v >= 3); };
var isOwner = function () { return !v2() || S.role === 'owner'; };
var items = function () { return (S && S.items) || []; };
var itemBy = function (code) { return items().find(function (i) { return i.code === code; }); };

var uid = function () { return (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2)); };
var kes = function (n) { return 'KES ' + Math.round(n || 0).toLocaleString('en-KE'); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
var $ = function (id) { return document.getElementById(id); };
var unsynced = function (x) { return !x.synced; };
var opts = function (list, val) { return list.map(function (o) { return '<option' + (o === val ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join(''); };
var saveDraft = function () { try { localStorage.setItem('draft_' + KEY, JSON.stringify({ lines: recLines, sup: F.recSupplier, ref: recRef })); } catch (e) {} };
function greet() { var h = new Date().getHours(); return h < 12 ? 'Good morning' : (h < 17 ? 'Good afternoon' : 'Good evening'); }

function toast(msg) {
  var d = document.createElement('div'); d.className = 'toast'; d.textContent = msg;
  document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2200);
}

/* stock = what the server last counted, adjusted for what this phone has not sent yet */
function stockOf(it) {
  var s = it.stock;
  L.sales.forEach(function (x) { if (!x.synced && x.code === it.code) s -= x.qty; });
  L.receipts.forEach(function (x) { if (!x.synced && x.code === it.code) s += x.qty; });
  L.adjustments.forEach(function (x) { if (!x.synced && x.code === it.code) s += x.qty; });
  return s;
}

async function refreshLocal(force) {
  for (var n of STORES) L[n] = await all(n);
  render(force);
}

/* ---------- talking to the server ---------- */
async function loadState() {
  var r = await fetch(API + '?token=' + encodeURIComponent(KEY));
  var j = await r.json();
  if (!j.ok) throw new Error(j.error || 'load failed');
  S = j;
  try { localStorage.setItem('state_' + KEY, JSON.stringify(j)); } catch (e) {}
}
async function post(obj) {
  var r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(obj) });
  return r.json();
}

async function sync() {
  if (syncing || !API || !navigator.onLine) { renderStatus(); return; }
  syncing = true; renderStatus();
  try {
    var pend = {};
    for (var n of STORES) pend[n] = (await all(n)).filter(unsynced);
    var any = STORES.some(function (n) { return pend[n].length; });
    var j = null;
    if (any) {
      j = await post({ token: KEY, sales: pend.sales, receipts: pend.receipts, payments: pend.payments, adjustments: pend.adjustments, expenses: pend.expenses });
      if (!j.ok) throw new Error(j.error || 'sync failed');
    }
    await loadState(); // fresh totals, including the other phones
    if (j) {
      // mark as sent only after the fresh numbers are in, so totals never dip or double
      for (var n2 of STORES) for (var o of pend[n2]) if ((j[n2] || []).indexOf(o.id) > -1) await put(n2, Object.assign({}, o, { synced: 1 }));
    }
    lastSync = new Date(); syncErr = false; errMsg = '';
  } catch (e) { syncErr = true; errMsg = String(e.message || e); }
  syncing = false;
  await refreshLocal(false);
}

function unsyncedCount() {
  var n = 0; STORES.forEach(function (s) { n += L[s].filter(unsynced).length; }); return n;
}

function renderStatus() {
  var n = unsyncedCount(), el = $('st');
  if (syncing) el.textContent = 'Syncing…';
  else if (syncErr && errMsg === 'paused') el.textContent = 'Account paused';
  else if (syncErr && errMsg === 'inactive') el.textContent = 'Access removed';
  else if (syncErr && errMsg === 'bad key') el.textContent = 'Wrong link';
  else if (!navigator.onLine) el.textContent = 'Offline' + (n ? ' · ' + n + ' waiting' : '');
  else if (syncErr) el.textContent = 'Sync problem' + (n ? ' · ' + n + ' waiting' : '');
  else el.textContent = n ? n + ' waiting' : '✓ Synced';
  $('shop').firstChild.nodeValue = (S && S.shop) || 'Duka POS';
  $('who').textContent = greet() + (v2() ? ' · ' + (S.role === 'owner' ? 'Owner' : S.who) : '');
}

/* ---------- selling ---------- */
function addToCart(code) {
  var it = itemBy(code); if (!it) return;
  var s = stockOf(it);
  if (!(it.price > 0)) { toast(isOwner() ? 'Set a selling price first: Stock > Items' : 'This item has no price yet. Tell the owner.'); return; }
  if ((cart[code] || 0) + 1 > s) { toast(s <= 0 ? it.name + ' is out of stock' : 'Only ' + s + ' of ' + it.name + ' left'); return; }
  cart[code] = (cart[code] || 0) + 1;
  render(true);
}
function chg(code, d) {

/* ---------- numbers shown on screens ---------- */
function debtorsNow() {
  var map = {};
  ((S && S.debtors) || []).forEach(function (d) { map[d.name.trim().toLowerCase()] = { name: d.name, phone: d.phone || '', balance: d.balance, oldestDays: d.oldestDays }; });
  L.sales.forEach(function (s) {
    if (s.synced || s.payment !== 'Credit') return;
    var k = s.customer.trim().toLowerCase();
    var m = map[k] = map[k] || { name: s.customer, phone: s.phone || '', balance: 0, oldestDays: 0 };
    m.balance += s.qty * s.price;
  });
  L.payments.forEach(function (p) {
    if (p.synced) return;
    var m = map[p.customer.trim().toLowerCase()];
    if (m) m.balance -= p.amount;
  });
  return Object.keys(map).map(function (k) { return map[k]; }).filter(function (m) { return m.balance > 0.5; })
    .sort(function (a, b) { return b.balance - a.balance; });
}

function todayNums() {
  var start = new Date(); start.setHours(0, 0, 0, 0);
  var cost = {}; items().forEach(function (i) { cost[i.code] = i.cost || 0; });
  var base = v2() ? (S.today || {}) : {};
  var be = base.exp || {};
  var t = { sales: base.sales || 0, profit: base.profit || 0, cash: base.cash || 0, mpesa: base.mpesa || 0, credit: base.credit || 0, collected: base.collected || 0,
            collCash: base.collCash || 0, collMp: base.collMp || 0, exp: be.total || 0, expCash: be.cash || 0, expMp: be.mpesa || 0 };
  var units = {}; (base.top || []).forEach(function (x) { units[x.name] = x.units; });
  var by = {}; (base.byCashier || []).forEach(function (c) { by[c.name] = { name: c.name, sales: c.sales, credit: c.credit, collected: c.collected }; });
  var me = (S && S.who) || 'Owner';
  var mine = by[me] = by[me] || { name: me, sales: 0, credit: 0, collected: 0 };
  L.sales.forEach(function (s) {
    if (v2() && s.synced) return;               // already inside the server's numbers
    if (new Date(s.ts) < start) return;
    var v = s.qty * s.price;
    t.sales += v; t.profit += (s.price - (cost[s.code] || 0)) * s.qty; mine.sales += v;
    if (s.payment === 'Cash') t.cash += v; else if (s.payment === 'M-Pesa') t.mpesa += v; else if (s.payment === 'Credit') { t.credit += v; mine.credit += v; }
    units[s.name] = (units[s.name] || 0) + s.qty;
  });
  L.payments.forEach(function (p) {
    if (p.synced || new Date(p.ts) < start) return;
    t.collected += p.amount; mine.collected += p.amount;
    if (p.method === 'Cash') t.collCash += p.amount; else t.collMp += p.amount;
  });
  L.expenses.forEach(function (x) {
    if (x.synced || new Date(x.ts) < start) return;
    t.exp += x.amount; if (x.method === 'Cash') t.expCash += x.amount; else t.expMp += x.amount;
  });
  var top = Object.keys(units).sort(function (a, b) { return units[b] - units[a]; }).slice(0, 5).map(function (n) { return { name: n, units: units[n] }; });
  var byList = Object.keys(by).map(function (k) { return by[k]; }).filter(function (c) { return c.sales > 0 || c.collected > 0; })
    .sort(function (a, b) { return b.sales - a.sales; });
  return { t: t, top: top, by: byList };
}

  if (!prev) return '—';

function waNumber(p) {

}

function periodRange(p) {
  var n = new Date(), t = ymd(n), d;

  if (p === 'month') return [ymd(new Date(n.getFullYear(), n.getMonth(), 1)), t];
  if (p === 'last') return [ymd(new Date(n.getFullYear(), n.getMonth() - 1, 1)), ymd(new Date(n.getFullYear(), n.getMonth(), 0))];
  d = new Date(n); d.setDate(d.getDate() - 29); return [ymd(d), t];   // last 30 days
}

/* ---------- barcode scanning (phones whose browser supports it) ---------- */
async function openScanner(onCode) {
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices) { toast('Scanning is not supported on this phone. Type the item name instead.'); return; }
  var stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); } catch (e) { toast('Allow the camera to scan'); return; }
  var ov = document.createElement('div'); ov.className = 'scan';
  ov.innerHTML = '<video playsinline muted></video><div class="scanbar"><span>Point the camera at the barcode</span><button class="ghost" id="scanX">Close</button></div>';
  document.body.appendChild(ov);
  var v = ov.querySelector('video'), alive = true;
  v.srcObject = stream; try { await v.play(); } catch (e) {}
  var det = new BarcodeDetector();
  var stop = function () { alive = false; stream.getTracks().forEach(function (t) { t.stop(); }); ov.remove(); };
  ov.querySelector('#scanX').onclick = stop;
  (async function loop() {
    while (alive) {
      try { var r = await det.detect(v); if (r.length) { var code = r[0].rawValue; stop(); onCode(code); return; } } catch (e) {}
      await new Promise(function (res) { setTimeout(res, 250); });
    }
  })();
}
function scannedForSale(code) {
  var it = items().find(function (i) { return i.barcode === code || i.code === code; });

  var list = tickets(), names = tablesList(), html = '';

  if (ready) html += '<div class="ok"><b>' + ready + ' dish' + (ready > 1 ? 'es are' : ' is') + ' ready to serve</b></div>';
  var tile = function (t, name) {
    if (!t) return '<button class="tbl free" data-tb="' + esc(name) + '"><b>' + esc(name) + '</b><span class="mu">Free</span></button>';
    var rd = t.lines.filter(function (l) { return l.status === 'ready'; }).length, n = t.lines.filter(function (l) { return l.status !== 'void'; }).length;
    return '<button class="tbl busy' + (rd ? ' rdy' : '') + '" data-tbill="' + esc(t.id) + '"><b>' + esc(t.table) + '</b><span>' + kes(t.total) + '</span><span class="mu">' + n + ' dish' + (n === 1 ? '' : 'es') + ' · ' + minsAgo(t.t) + ' min' + '</span>' + (rd ? '<span class="grn">' + rd + ' ready</span>' : '') + '</button>';
  };
  var tiles = '';

    var bs = list.filter(function (t) { return t.table === n; });

  if (!names.length && isOwner()) html += '<div class="warn">Name your tables in <b>More › Tables</b>. Until then use “Takeaway / new bill”.</div>';
  html += '<div class="tbls">' + tiles + '</div>';

}

async function sendDraft() {

  var j = await tkPost({ action: 'saveTicket', id: draft.id, table: draft.table, covers: Number(draft.covers) || 0, note: draft.note || '',

  tkBusy = false;

  render(true);

/* ---------- payment ---------- */
function openPay() {
  var t = draft && ticketBy(draft.id); if (!t) return;
  payRows = [{ method: 'Cash', amount: '', customer: '', phone: '' }]; tkSub = 'pay'; render(true);
}
function payTotals() {
  var t = ticketBy(draft.id), tot = billCents(t ? t.lines : []).total, sum = 0;
  payRows.forEach(function (r) { sum += c100(r.amount); });

}
function payStatusHtml() {
  var p = payTotals();
  return p.left === 0 ? '<span class="grn">Matches the bill ✓</span>' : p.left > 0 ? '<span class="amb">Still to pay ' + kes(p.left / 100) + '</span>' : '<span class="red">Too much by ' + kes(-p.left / 100) + '</span>';
}
function viewPay() {
  var t = draft && ticketBy(draft.id);
  if (!t || !payRows) { tkSub = 'tables'; return viewTables(); }

    '<div class="hero"><div class="hi">Amount to pay</div><div class="amt">' + kes(p.tot / 100) + '</div><div class="sub">' + (t.service > 0 ? 'Includes service charge ' + kes(t.service) : 'Bill total') + '</div></div>' +
    '<div class="card"><h3>How is it paid?</h3><div class="row"><button class="pay" data-pfull="Cash">All cash</button><button class="pay" data-pfull="M-Pesa">All M-Pesa</button></div>' +
    '<div class="mu" style="margin-top:6px">Or split between ways below. Each part is counted in your cash, M-Pesa or credit figures.</div>' +
    payRows.map(function (r, k) {
      return '<div class="rl"><div class="two"><select data-pr="' + k + '" data-pk="method">' + opts(['Cash', 'M-Pesa', 'Credit'], r.method) + '</select><input data-pr="' + k + '" data-pk="amount" type="number" inputmode="decimal" placeholder="Amount" value="' + esc(r.amount) + '"></div>' +
        (r.method === 'Credit' ? '<div class="two" style="margin-top:6px"><input data-pr="' + k + '" data-pk="customer" list="pcust" placeholder="Customer name" value="' + esc(r.customer) + '" autocomplete="off"><input data-pr="' + k + '" data-pk="phone" type="tel" placeholder="Phone (optional)" value="' + esc(r.phone) + '"></div>' : '') +
        (payRows.length > 1 ? '<div class="row"><button class="ghost danger" data-prm="' + k + '">Remove</button><button class="ghost" data-pleft="' + k + '">Put the rest here</button></div>' : '<div class="row"><button class="ghost" data-pleft="' + k + '">Full amount</button></div>') + '</div>';
    }).join('') + '<datalist id="pcust">' + Object.keys(names).map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>' +
    '<div class="row"><button class="ghost" id="addPay" style="flex:1">+ Add another way</button></div><div id="payStat" style="margin-top:10px;font-size:16px">' + payStatusHtml() + '</div>' +

async function confirmPay() {
  var p = payTotals(), t = ticketBy(draft.id);
  if (p.left !== 0) { toast(p.left > 0 ? 'The payments do not cover the bill yet' : 'The payments are more than the bill'); return; }
  for (var r of payRows) if (c100(r.amount) > 0 && r.method === 'Credit' && !r.customer.trim()) { toast('Type the customer name for credit'); return; }
  if (tkBusy) return; tkBusy = true;
  var j = await tkPost({ action: 'payTicket', ticket: t.id, payments: payRows.filter(function (r) { return c100(r.amount) > 0; }).map(function (r) { return { method: r.method, amount: Number(r.amount), customer: r.customer.trim(), phone: r.phone.trim() }; }) });
  tkBusy = false;
  if (!j) { render(true); return; }
  mergeTicket(Object.assign({}, j.ticket, { status: 'Paid' }));
  paidBill = j.ticket; draft = null; payRows = null; saveTk(); tkSub = 'paid';
  try { await loadState(); } catch (e) {}
  render(true);
}
function viewPaid() {
  if (!paidBill) { tkSub = 'tables'; return viewTables(); }
  $('main').innerHTML = '<div class="ok"><b>Paid ✓</b> Table ' + esc(paidBill.table) + ' · ' + kes(paidBill.total) + '</div>' +
    '<div class="card">' + billDoc(paidBill, true) + '</div><div class="row"><button class="ghost" id="printPaid">Print receipt</button><button class="go" id="paidDone">Back to tables</button></div>';
}

/* ---------- kitchen screen ---------- */
function viewKitchen() {
  var list = tickets().slice().sort(function (a, b) { return a.t - b.t; });
  var role = S && S.role, cook = role === 'kitchen' || role === 'owner';
  var hasBar = list.some(function (t) { return t.lines.some(function (l) { return l.station === 'bar'; }); });
  var html = '';
  if (!kitchenOn()) { $('main').innerHTML = lockCard('Live kitchen screen', 'standard'); return; }
  if (hasBar || kStation !== 'all') html += '<div class="chips">' + [['all', 'All'], ['kitchen', 'Kitchen'], ['bar', 'Bar']].map(function (s) { return '<button class="chip' + (kStation === s[0] ? ' on' : '') + '" data-kst="' + s[0] + '">' + s[1] + '</button>'; }).join('') + '</div>';
  var cards = '';
  list.forEach(function (t) {
    var ls = t.lines.filter(function (l) { return l.status !== 'void' && l.status !== 'served' && (kStation === 'all' || l.station === kStation); });
    if (!ls.length) return;
    var oldest = Math.min.apply(null, ls.filter(function (l) { return l.status === 'sent'; }).map(function (l) { return l.sentAt; }).concat([Date.now()]));
    var age = minsAgo(oldest), pending = ls.filter(function (l) { return l.status === 'sent'; });
    cards += '<div class="kcard' + (pending.length ? (age >= 15 ? ' late' : '') : ' done') + '"><div class="kh"><b>Table ' + esc(t.table) + '</b><span>' + esc(t.no) + (pending.length ? ' · ' + age + ' min' : '') + (t.waiter ? ' · ' + esc(t.waiter) : '') + '</span></div>' +
      ls.map(function (l) {
        var btn = '';
        if (l.status === 'sent' && cook) btn = '<button class="go" style="flex:none;padding:8px 14px;font-size:14px" data-ks="' + esc(t.id + '|' + l.lid + '|ready') + '">Ready</button>';
        else if (l.status === 'ready' && role === 'kitchen') btn = '<button class="ghost" data-ks="' + esc(t.id + '|' + l.lid + '|sent') + '">Undo</button>';
        else if (l.status === 'ready') btn = '<button class="go" style="flex:none;padding:8px 14px;font-size:14px;background:#2563eb" data-ks="' + esc(t.id + '|' + l.lid + '|served') + '">Serve</button>';
        return '<div class="kl ' + l.status + '"><span><b>' + l.qty + ' ×</b> ' + esc(l.name) + (l.station === 'bar' ? ' <span class="pill">bar</span>' : '') + (l.note ? '<br><span class="knote">' + esc(l.note) + '</span>' : '') + '</span>' + btn + '</div>';
      }).join('') +
      (pending.length > 1 && cook ? '<div class="row"><button class="ghost" style="flex:1" data-kall="' + esc(t.id + '|' + pending.map(function (l) { return l.lid; }).join(',')) + '">All ready</button></div>' : '') + '</div>';
  });
  $('main').innerHTML = html + (cards || '<div class="card mu" style="text-align:center">Nothing to cook right now. New orders appear here by themselves.</div>') +
    '<p class="mu" style="text-align:center">' + (navigator.onLine ? 'Updates every few seconds' : 'Offline: reconnect to see new orders') + '</p>';
}

  if (m.byHour.length) h += '<div class="sec">Busiest hours</div>' + hBars(m.byHour.map(function (x) { return { name: pad2(x.h) + ':00', value: x.v, label: money2(x.v) }; }), '#2563eb');
